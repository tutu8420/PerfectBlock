EnableAutoBlock: "Take over the block key when an attack the mod has learned is about to land. Off by default: learning and logging still run, nothing is pressed for you."
DetectRange: "Only enemies within this many metres are watched and blocked against."
LogLearning: "Write one log line per recorded landing point (samples, hit ratio, spread)."
LogAttempts: "Log every simulated block with the milliseconds left before the learned landing point. Noisy; for tuning."
ForceBlockTest: "Diagnostic only: hold the block key on every frame, ignoring enemies and learning. Stand still in the open and see whether the character actually raises its block. If it does not, the simulated key never reaches the game."
LeadMs: "How early (ms) to press block before the learned landing point. Fixed on purpose: the block timer starts at the press, so a larger lead pushes you closer to the 0.25 s cap and out of the perfect window."
PressTail: "How long (ms) to keep the simulated block down after the learned landing point. Covers prediction error; a late press is still an ordinary block. Press length = Lead Ms + Press Tail Ms."
MinSamples: "Samples needed before an attack counts as learned."
MaxSpread: "Largest allowed spread between recorded landing points (0.05 = 5%). Wider means the attack has several hit points or a variable speed, and is ignored."
PatchLearn: "attack learning"
PatchBlockKey: "block key"
PatchSetControls: "input boundary"
PatchStagger: "reliable perfect block"
PatchInAttack: "attack cancel transition"
PatchIsBlocking: "block during transition"
PatchBlockResult: "block result"
PatchDamage: "damage taken"
PatchCombat: "combat text"
PatchVanilla: "hide vanilla numbers"
ReleaseOnAttack: "Release the forced block the moment you attack after a perfect block; the next incoming attack blocks again as usual."
ShowFlash: "Show PERFECT BLOCK in the middle of the screen when a perfect block lands; several in a row stack upwards."
Reliable: "On a perfect block, ignore the vanilla rule that a hit bigger than your block armor plus stagger threshold breaks the block (ReliableBlock behaviour, perfect blocks only)."
CancelManual: "Pressing block while you are mid-swing cancels the swing so the block starts immediately (AttackCancel behaviour)."
HoldAfterPerfect: "After a perfect block, keep holding the block for this many milliseconds before letting go. The press already stays down for 'Press Tail Ms' after the hit, so 0-150 behaves the same; 250+ hides the shield coming back down and turns the next hit (in a multi-enemy fight) into an ordinary block."
AfterPerfect: "What happens after a perfect block. Release = hold for 'Hold After Perfect (ms)', then let go. Keep = keep blocking until you attack or press block yourself (room for a future parry)."
ShowCombat: "Draw damage numbers: damage you take on the left, damage you deal on the right."
VanillaNumbers: "Keep the game's own floating damage numbers. Off by default, since our own text replaces them."
Font: "Font used by the combat text and the PERFECT BLOCK flash. Any font installed on Windows works (Impact, Arial Black, Microsoft YaHei); falls back to the game font if missing."
BaseSize: "Font size of a normal damage number."
CritScale: "Size multiplier for the last hit of a combo or a doubled hit."
LabelFont: "Font for the bracketed damage type (Swing/Heavy...). It must carry Chinese glyphs, so it is separate from the number font. Any font installed on Windows; falls back to the game font if missing."
WeaponIcon: "Draw the weapon icon in front of every damage number: your weapon for damage you deal, the attacker's weapon for damage you take (bites and claws have none, so no icon)."
TakenX: "Damage you take: horizontal anchor, 0 = left edge, 1 = right edge."
TakenY: "Damage you take: vertical anchor, 0 = top, 1 = bottom."
DealtX: "Damage you deal: horizontal anchor, 0 = left edge, 1 = right edge."
DealtY: "Damage you deal: vertical anchor, 0 = top, 1 = bottom."
TestCombat: "Diagnostic: always draw three sample numbers (red taken on the left, yellow dealt and a big heavy hit on the right) so you can drag the position sliders and see whether the text renders at all."
