EnableAutoBlock: "自动格挡：学过的攻击快到命中时，替你按住格挡键。默认关闭——关闭时只学习、只写日志，不会动你的操作。"
DetectRange: "检测范围（米）：只观察这个距离内的敌人。"
LogLearning: "学习日志：每学到一个命中点就往日志里写一行（样本数 + 命中百分比 + 离散度）。"
LogAttempts: "尝试日志：每次自动格挡都写一行，含距离命中还有多少毫秒。调试用，会比较吵。"
ForceBlockTest: "测试开关（诊断用）：打开后无视敌人与学习数据，每帧强制按住格挡键。用来单独验证“模拟的格挡键到底有没有进游戏”——站在空地上看角色会不会一直举着格挡；如果没举，说明按键没生效。"
LeadMs: "提前量（毫秒）：在学到的命中点之前多少毫秒按下格挡。固定值，故意不做自适应——格挡计时从按下开始算，提前量越大，命中时计时越接近 0.25 秒上限，越不完美。"
PressTail: "按压尾巴（毫秒）：学到的命中点之后再继续按住多久。用来兜住预测误差；晚一点至少还是普通格挡，不会白挨。按下总时长 = 提前量 + 按压尾巴。"
MinSamples: "最少样本：同一种攻击要记录到几次，才认为学会了。"
MaxSpread: "最大离散度：记录的命中百分比之间的最大差值（0.05 = 5%）。太分散说明这条攻击有多个命中点或速度不固定，直接不采用。"
PatchLearn: "学习攻击"
PatchBlockKey: "模拟格挡键"
PatchSetControls: "输入边界（SetControls）"
PatchStagger: "完美格挡无视硬直规则"
ReleaseOnAttack: "格挡后攻击解控：完美格挡触发后，你主动攻击的瞬间解除强制格挡（下一波敌人攻击时再自动格挡）。"
ShowFlash: "完美提示：完美格挡时屏幕中央显示 PERFECT BLOCK，连续触发时向上叠加。"
Reliable: "可靠完美格挡：完美格挡时忽略原版“伤害超过格挡护甲并填满硬直阈值就破防”的规则（相当于 ReliableBlock，但只对完美格挡生效）。"
CancelAttack: "（已废弃）格挡取消攻击"
CancelManual: "手动格挡取消挥刀：与自动格挡无关。你挥刀途中按下格挡键，立即取消挥击并开始格挡。"
HoldAfterPerfect: "完美格挡后继续按住（毫秒）：完美格挡命中后，格挡再按住这么久才松开。命中后本来就会按满「按压尾巴」，所以 0~150 手感一样；250 以上会遮住收盾动作，多敌人时还会把下一击变成普通格挡。只有确实想多举一会儿才往上调。"
AfterPerfect: "完美格挡之后：Release = 按上面的毫秒数继续按住再松开；Keep = 一直挡到你主动攻击或再按一次格挡键（给以后的完美弹反留的口子）。"
ShowCombat: "战斗数字：左侧显示你受到的伤害，右侧显示你打出的伤害。"
VanillaNumbers: "显示原版数字：保留游戏自带的浮动伤害数字。默认关闭，因为我们的数字已经取代它。"
Font: "字体：战斗文字和 PERFECT BLOCK 提示使用的字体。填 Windows 已安装的字体名（Impact、Arial Black、Microsoft YaHei），找不到会退回游戏字体。"
BaseSize: "基础字号：普通伤害数字的大小。"
CritScale: "大数字倍率：连段最后一击等场合的字号放大倍数。"
LabelFont: "标签字体：括号里的伤害类型（挥砍/重击…）用这个字体画，必须有中文字形，所以和数字字体分开。填 Windows 已安装的字体名，找不到会退回游戏字体。"
WeaponIcon: "武器图标：在每个伤害数字前面画武器图标（输出伤害用你手里的武器，承受伤害用攻击者的武器；咬/爪这类没有武器的就不画）。"
TakenX: "承受伤害 X：横向锚点，0 = 屏幕最左，1 = 最右。"
TakenY: "承受伤害 Y：纵向锚点，0 = 屏幕最上，1 = 最下。"
DealtX: "输出伤害 X：横向锚点，0 = 屏幕最左，1 = 最右。"
DealtY: "输出伤害 Y：纵向锚点，0 = 屏幕最上，1 = 最下。"
TestCombat: "测试战斗数字（诊断用）：打开后每帧固定画三个示例数字（左边红色承伤、右边黄色输出、再上面一个大的重击），用来拖滑条定位、确认文字到底会不会出现。"
PatchCombat: "战斗数字"
PatchVanilla: "屏蔽原版数字"
PatchInAttack: "取消攻击过渡"
PatchIsBlocking: "过渡期格挡判定"
PatchBlockResult: "格挡结果"
PatchDamage: "受击检测"
LabelHeavy: "重击"
LabelSlash: "挥砍"
LabelPierce: "刺击"
LabelBlunt: "钝击"
LabelChop: "劈砍"
LabelFire: "火焰"
LabelFrost: "冰霜"
LabelLightning: "闪电"
LabelPoison: "毒素"
LabelSpirit: "精神"
